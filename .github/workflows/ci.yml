name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run emit:ts
      - run: node scripts/run-tests.mjs --test-reporter=spec --experimental-test-coverage --test-coverage-lines=85
        env:
          WORKBENCH_KEEP_TEST_LOGS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-node-${{ matrix.node }}
          path: /tmp/workbench-test-*/node-test.log

  test-bun:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: npm ci
      - run: npm run emit:ts
      - run: bun test --isolate --expose-gc --timeout 30000 --path-ignore-patterns 'test/browser/**' test scripts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
